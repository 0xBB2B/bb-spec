name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run structural validation
        run: bash tests/validate.sh

      - name: Run git-workflow-guard behavior tests
        run: bash tests/git-workflow-guard.test.sh

      - name: Run bbspec-paths behavior tests
        run: bash tests/bbspec-paths.test.sh

      - name: Run branch-prds behavior tests
        run: bash tests/branch-prds.test.sh

      - name: Run pr-status behavior tests
        run: bash tests/pr-status.test.sh
