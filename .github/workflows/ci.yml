name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 一个失败不中断，跑完全部再按是否有失败给出结果
      - name: Run all tests
        run: |
          failed=0
          for t in tests/*.sh; do
            echo "::group::$t"
            bash "$t" || { failed=1; echo "::error file=$t::$t 失败"; }
            echo "::endgroup::"
          done
          exit $failed
